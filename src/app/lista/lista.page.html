<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Tarefas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let tarefa of tarefas" appDestaque>
      <ion-label [style.text-decoration]="tarefa.concluida ? 'line-through' : 'none'">
        {{ tarefa.titulo }}
      </ion-label>
    </ion-item>

    <ion-item *ngIf="tarefas.length === 0">
      <ion-label color="medium">Nenhuma tarefa cadastrada</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
